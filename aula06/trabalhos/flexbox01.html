<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox do Balacobaco</title>
    <style>
        .container
        {   /*display flex aciona a função flexbox, por padão o felxbox utiliza o row*/
            display: flex;
            /*dis*/
            flex-direction: row;
            background-color: gray;
        }
        div
        {
            background-color: #4caf50;
            margin: 10px;
            padding: 10px;
            font-size:18px;
            color: white;
        }

    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        
    </div>
    
</body>
</html>
