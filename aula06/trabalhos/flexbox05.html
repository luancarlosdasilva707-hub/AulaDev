<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            display: flex;
            flex-wrap: wrap;
            background-color: gray;
            justify-content:center;
            align-items: center;
            height: auto;
        }
        .container div
        {
            display: flex;
            flex-wrap: wrap;
            width:250px;
            height:200px;
            background-color: #4caf50;
            margin:10px;
            padding:10px;
            font-size:50px;
            justify-content: center;
            align-items:center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>

    </div>
    
</body>
</html>
