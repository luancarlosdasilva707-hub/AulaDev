<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aula 01 - Dom</title>
    
    
</head>
<body style="text-align: center; font-family: Arial, Helvetica, sans-serif;">
    <div class="paodemilho">
        
    <h1>Aula de DOM </h1>
    <p id="paragrafo">Um texto qualquer falando qualquer coisa</p>
    <label>Informe um numero</label>
    <input type="number" id="numero">
    <button id="enviamsg" onclick="clicou()">Clicar</button>

    </div>
    <script>
        function clicou(){
            let botao = document.querySelector("#enviamsg");
            console.log(botao);
            alert("clicou");

            let h1 = document.querySelector("h1");
            h1.innerHTML = "Outro texto";
            h1.style.backgroundColor = "red";

            let body = document.querySelector("body");
            body.style.backgroundColor = "blue";

            let paragrafo = document.querySelector("#paragrafo");
            paragrafo.textContent = "mudei o texto do paragrafo tropa ";
            paragrafo.style.fontSize = "24px";

            let numero1 = document.querySelector("#numero").value;
            alert("Numero digitado foi: " + numero1);
        }
       
    </script>
</body>
</html>
