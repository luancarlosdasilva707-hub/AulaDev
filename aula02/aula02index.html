<body style="background-color: black; color: white;">
    <button>CLique em mim </button><!--Botão-->
<h4 style="color: aquamarine;"> Listas</h4>

    <li>Azul</li><!--linha ou seja item-->

</ul>

</ol>

<table width="400", border="1"><!--Defina a tabela e a espessura da borda -->
