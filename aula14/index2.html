<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .escondido{
            display: none;
        }
    </style>
</head>
<body>
    <button id="btn">
        Mostrar/Ocultar
    </button>
    <p id="mensagem">Esta mensagem pode ser escondida</p>

    <script>
    
        const botao =
         document.querySelector("#btn");
        const mensagem =
        document.querySelector("#mensagem");
        botao.addEventListener("click",
        function() {
            mensagem.classList
            .toggle("escondido");
        });
        
    </script>
    
</body>
</html>
